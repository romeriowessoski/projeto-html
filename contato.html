<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contato - Meu Projeto</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/contato.js" defer></script>
</head>

<body>

    <header class="cabecalho">

        <div class="container cabecalho-conteudo">

            <h1>Entre em contato</h1>

            <nav
                class="nav"
                aria-label="Navegação principal"
            >

                <a href="index.html">
                    Início
                </a>

                <a href="sobre.html">
                    Sobre
                </a>

                <a
                    class="ativo"
                    href="contato.html"
                    aria-current="page"
                >
                    Contato
                </a>

            </nav>

        </div>

    </header>


    <main class="container">

        <section class="secao">

            <h2>Formulário de contato</h2>

            <p>
                Preencha os campos abaixo para
                validar sua mensagem.
            </p>


            <form
                id="form-contato"
                class="formulario"
                novalidate
            >

                <div class="form-row">

                    <div class="campo">

                        <label for="nome">
                            Nome *
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            placeholder="Digite seu nome"
                            aria-describedby="erro-nome"
                            required
                        >

                        <small
                            id="erro-nome"
                            class="mensagem-erro"
                        ></small>

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="nome@email.com"
                            aria-describedby="erro-email"
                            required
                        >

                        <small
                            id="erro-email"
                            class="mensagem-erro"
                        ></small>

                    </div>

                </div>


                <div class="campo">

                    <label for="assunto">
                        Assunto *
                    </label>

                    <input
                        type="text"
                        id="assunto"
                        name="assunto"
                        placeholder="Informe o assunto"
                        aria-describedby="erro-assunto"
                        required
                    >

                    <small
                        id="erro-assunto"
                        class="mensagem-erro"
                    ></small>

                </div>


                <div class="campo">

                    <label for="mensagem">
                        Mensagem *
                    </label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        placeholder="Digite sua mensagem"
                        aria-describedby="erro-mensagem"
                        required
                    ></textarea>

                    <small
                        id="erro-mensagem"
                        class="mensagem-erro"
                    ></small>

                </div>


                <button
                    class="btn"
                    type="submit"
                >
                    Enviar mensagem
                </button>

            </form>


            <p
                id="status-formulario"
                class="status-formulario"
                role="status"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <footer class="rodape">

        <div class="container">

            <p>
                Desenvolvido durante as aulas -
                SENAC.
            </p>

        </div>

    </footer>

</body>
</html>
